name: MAZA static checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "MAZA_ADMIN_FINAL.html"
      - "supabase/migrations/**"
      - "docs/MAZA_ADMIN_MFA_TEST_PLAN.md"
      - ".github/workflows/maza-static-checks.yml"
  push:
    branches: [secure-maza-admin-mfa]
    paths:
      - "index.html"
      - "MAZA_ADMIN_FINAL.html"
      - "supabase/migrations/**"
      - "docs/MAZA_ADMIN_MFA_TEST_PLAN.md"
      - ".github/workflows/maza-static-checks.yml"

permissions:
  contents: read

jobs:
  static-checks:
    name: Parse HTML scripts and verify image limits
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          for (const file of ['index.html', 'MAZA_ADMIN_FINAL.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi)]
              .filter(([, attrs]) => !/\\bsrc\\s*=/i.test(attrs))
              .map(([, , source]) => source.trim())
              .filter(Boolean);
            if (!scripts.length) throw new Error(file + ': no inline JavaScript found');
            scripts.forEach((source, index) => {
              try { new Function(source); }
              catch (error) {
                throw new Error(file + ': inline script ' + (index + 1) + ' failed to parse: ' + error.message);
              }
            });
            console.log('PASS JavaScript syntax: ' + file + ' (' + scripts.length + ' inline script(s))');
          }
          NODE
      - name: Verify 12-image product limit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const admin = fs.readFileSync('MAZA_ADMIN_FINAL.html', 'utf8');
          const store = fs.readFileSync('index.html', 'utf8');
          const checks = [
            ['admin upload rejects more than 12 images', /files\\.length\\s*>\\s*12/.test(admin)],
            ['admin gallery keeps up to 12 images', /return\\s+a\\.slice\\(0,\\s*12\\)/.test(admin)],
            ['storefront gallery keeps up to 12 images', /return\\s+a\\.slice\\(0,\\s*12\\)/.test(store)],
            ['admin image counter shows denominator 12', /\\$\\{imgs\\(p\\)\\.length\\}\\/12/.test(admin)],
            ['admin per-image limit remains 15 MB', /15\\s*\\*\\s*1024\\s*\\*\\s*1024/.test(admin)],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
