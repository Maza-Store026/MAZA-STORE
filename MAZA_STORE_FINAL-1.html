function fillWilayas(){const s=$('wilaya');s.innerHTML='<option value="">'+(ar?'اختر الولاية':'Choisir la wilaya')+'</option>'+WILAYAS.map(x=>`<option>${x}</option>`).join('')}
async function loadCommunes(){try{const r=await fetch('https://cdn.jsdelivr.net/gh/Mohamed-gp/algeria_69_wilayas@main/communes.json',{cache:'no-store'});const j=await r.json();communes=Array.isArray(j)?j:(j.communes||[])}catch{communes=[]}}
function updateCommunes(){const code=String(parseInt(($('wilaya').value||'0').slice(0,2),10));const arr=communes.filter(x=>String(x.wilaya_id??x.wilaya_code).padStart(2,'0')===code.padStart(2,'0'));$('commune').innerHTML='<option value="">'+(ar?'اختر البلدية':'Choisir la commune')+'</option>'+arr.sort((a,b)=>(a.name_ar||a.commune_name||'').localeCompare(b.name_ar||b.commune_name||'')).map(x=>{const n=x.name_ar||x.commune_name||x.name||'';return `<option>${esc(n)}</option>`}).join('')}
async function submitOrder(e){e.preventDefault();if(!cart.length){$('formMsg').textContent=ar?'السلة فارغة':'Le panier est vide';return}const btn=$('confirm');btn.disabled=true;try{const total=cart.reduce((s,i)=>s+i.price*i.q,0),items=cart.map(i=>({product_name:(String(i.name??'').trim()||'منتج MAZA')+(i.color?' | اللون: '+i.color:'')+(i.size?' | الخيار: '+i.size:''),quantity:i.q,price:i.price}));const {error}=await supabaseClient.rpc('create_maza_order',{p_customer_name:$('name').value.trim(),p_phone:$('phone').value.trim(),p_wilaya:$('wilaya').value,p_commune:$('commune').value,p_address:$('address').value.trim(),p_total:total,p_items:items});if(error)throw error;$('formMsg').textContent=ar?'تم تسجيل طلبك بنجاح في MAZA STORE ✅':'Commande enregistrée avec succès ✅';cart=[];renderCart();e.target.reset();$('commune').innerHTML='<option value="">اختر البلدية</option>'}catch(err){$('formMsg').textContent=(ar?'تعذر تسجيل الطلب: ':'Erreur: ')+(err.message||'')}finally{btn.disabled=false}}
function toggleLang(){ar=!ar;document.documentElement.lang=ar?'ar':'fr';document.documentElement.dir=ar?'rtl':'ltr';$('lang').textContent=ar?'FR':'AR';$('heroTag').textContent=ar?'اختيارات عصرية، بلمسة MAZA':'Sélections modernes, avec la touche MAZA';$('heroBtn').textContent=ar?'اكتشف المجموعة':'Découvrir la collection';$('sectionTitle').textContent=ar?'منتجات مختارة':'Sélection MAZA';$('searchBox').placeholder=ar?'ابحث عن منتج...':'Rechercher un produit...';$('cartTitle').textContent=ar?'سلة المشتريات':'Panier';$('orderTitle').textContent=ar?'أكمل طلبك':'Finaliser la commande';$('name').placeholder=ar?'الاسم الكامل':'Nom complet';$('phone').placeholder=ar?'رقم الهاتف':'Numéro de téléphone';$('address').placeholder=ar?'العنوان':'Adresse';$('confirm').textContent=ar?'تأكيد الطلب — الدفع عند الاستلام':'Confirmer — paiement à la livraison';renderProducts();updateCommunes();renderCart()}
document.addEventListener('DOMContentLoaded',async()=>{fillWilayas();$('lang').onclick=toggleLang;$('searchBox').oninput=renderProducts;$('categoryFilter').onchange=renderProducts;$('wilaya').onchange=updateCommunes;$('orderForm').onsubmit=submitOrder;$('cartBtn').onclick=openCart;$('closeCart').onclick=closeCart;$('heroBtn').onclick=()=>$('productsSection').scrollIntoView({behavior:'smooth'});$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};await loadCategories();await loadCommunes();await loadProducts();renderCart();setInterval(()=>{if(document.visibilityState==='visible')loadProducts()},30000)});
</script></body></html>
